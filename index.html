:root{

  --p:#6D4AF0;--p2:#8B6CFF;--pl:#E6DEFF;--pd:#4B23D6;--pt:rgba(109,74,240,.10);

  --t:#15B486;--tl:#D2F6E9;--td:#00694E;--tm:#4ADEAD;

  --bg:#FBF8FF;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.5);--edge:rgba(255,255,255,.85);
  --c1:#F6F4FF;--c2:#EEECFF;--c3:#E2E0FB;
  --ink:#181A2F;--ink2:#484555;--ink3:#7B778A;--line:rgba(24,26,47,.08);

  --fh:"Outfit",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}

:root[data-skin="rio"]{--p:#F2367A;--p2:#F7639A;--pl:#FFDDE9;--pd:#B8125A;--pt:rgba(242,54,122,.10);--s:#00B894;--s2:#2ED1AE;--sl:#CFF5EC;--sd:#007A62;--au1:#FFF0B3;--au2:#FFD6E3;--au3:#CFF5EC;--au4:#FFE4C7}
:root[data-skin="himalaya"]{--p:#5B7CFA;--p2:#7F9AFB;--pl:#E0E7FF;--pd:#3550C9;--pt:rgba(91,124,250,.10);--s:#FF8A5C;--s2:#FFA77F;--sl:#FFE6D9;--sd:#B5481C;--au1:#FFE0CF;--au2:#E2E8FF;--au3:#F2F5FF;--au4:#D9E4FF}

  :root:not([data-theme="light"]){--bg:#11122A;--glass:rgba(34,36,70,.72);--glass2:rgba(34,36,70,.5);--edge:rgba(255,255,255,.08);--c1:#1E2042;--c2:#26284F;--c3:#33366A;--ink:#F3F1FF;--ink2:#CFCAE2;--ink3:#9C97B5;--line:rgba(255,255,255,.08);--pl:#2E2860;--pd:#C9B8FF;--sl:#4A2A2A;--tl:#16443A;--td:#6FE8C1;--gl:#4A3A1A;--gd:#FFD27A;--au1:#3A2350;--au2:#22265E;--au3:#163C44;--au4:#1B2A5E;--sh:0 16px 36px -8px rgba(0,0,0,.45);--shs:0 6px 18px -6px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:
 radial-gradient(45% 35% at 8% 4%,var(--au1),transparent 70%),
 radial-gradient(45% 38% at 100% 28%,var(--au2),transparent 70%),
 radial-gradient(42% 34% at 14% 70%,var(--au3),transparent 70%),
 radial-gradient(48% 38% at 90% 96%,var(--au4),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(0,-3%,0) scale(1.06)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--p);outline-offset:2px}
img,svg{max-width:100%;display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.xs{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px}
.h{font-family:var(--fh)}
.num{font-family:var(--fh);font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding:0 18px 130px}
.hidden{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--sh)}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;margin:0 -18px;padding:12px 18px 10px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.logo{display:flex;align-items:center;gap:9px}
.logo i{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--p2),var(--p));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -4px color-mix(in srgb,var(--p) 60%,transparent)}
.logo i .ic{width:20px;height:20px}
.logo b{display:block;font-family:var(--fh);font-weight:700;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.logo small{display:block;font-size:12px;color:var(--ink3);font-weight:600;line-height:1.1}
.pods{display:flex;gap:6px;margin-left:auto}
.pod{display:flex;align-items:center;gap:4px;padding:5px 10px 5px 8px;border-radius:999px;font-family:var(--fh);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shs)}
.pod .ic{width:16px;height:16px}
.pod.fl{background:color-mix(in srgb,var(--sl) 75%,transparent)} .pod.fl .ic{color:var(--s)}
.pod.co{background:color-mix(in srgb,var(--gl) 80%,transparent)} .pod.co .ic{color:var(--gd)}
.pod.fr{background:color-mix(in srgb,var(--au4) 80%,transparent)} .pod.fr .ic{color:#3D8FE0}
.ava{width:38px;height:38px;border-radius:50%;background:#cfd8f0 center 18%/cover;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tm),0 0 12px color-mix(in srgb,var(--tm) 60%,transparent);flex:none;margin-left:4px}

/* ---- tab bar ---- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100vw - 24px),440px);z-index:20;border-radius:999px;padding:6px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--edge);box-shadow:0 18px 40px -12px rgba(30,24,80,.25)}
.tabs nav{display:flex;gap:2px}
.tabs button{flex:1;min-width:0;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--fh);font-size:11.5px;font-weight:600;color:var(--ink3);transition:background .2s,color .2s}
.tabs button .ic{width:22px;height:22px}
.tabs button[aria-current="page"]{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--p) 70%,transparent)}
.tabs button.home:not([aria-current="page"]) .ic{color:var(--p)}
.tabs button.home .ic{width:24px;height:24px}

/* ---- primitives ---- */
.card{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--sh);border-radius:28px;padding:18px;margin:16px 0;position:relative}
.tint{background:var(--glass2)}
.eyebrow{font-family:var(--fb);font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--p)}
.eyebrow.g{color:var(--td)} .eyebrow.y{color:var(--gd)} .eyebrow.m{color:var(--ink3)} .eyebrow.o{color:var(--sd)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:999px;background:linear-gradient(90deg,var(--s),var(--s2));color:#fff;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--s) 80%,transparent);font-family:var(--fh);font-weight:600;font-size:17px;padding:12px 22px;margin-top:16px;transition:transform .12s,box-shadow .12s,filter .12s;text-align:center;letter-spacing:.005em}
.btn .ic{width:20px;height:20px;stroke-width:2.3}
.btn:active{transform:scale(.97);filter:brightness(.97)}
.btn.green{background:linear-gradient(90deg,var(--p),var(--p2));box-shadow:0 12px 26px -8px color-mix(in srgb,var(--p) 80%,transparent)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--edge);box-shadow:var(--shs);font-size:15px;min-height:50px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.btn.small{min-height:44px;font-size:14px;margin-top:10px}
.btn[disabled]{background:var(--c2);color:var(--ink3);box-shadow:none;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-family:var(--fb);font-weight:600;font-size:13px;background:color-mix(in srgb,var(--c2) 85%,transparent);color:var(--ink2);white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip.m{background:var(--tl);color:var(--td)} .chip.y{background:var(--gl);color:var(--gd)} .chip.o{background:var(--sl);color:var(--sd)} .chip.v{background:var(--pl);color:var(--pd)}
.chip.w{background:var(--glass);box-shadow:var(--shs);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.muted{color:var(--ink3);font-size:14px;font-weight:500}
.row{display:flex;gap:10px;align-items:center}
.sec{font-family:var(--fh);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:28px 0 2px;display:flex;align-items:center;gap:8px}
.sec .ic{color:var(--p)}
.secrow{display:flex;justify-content:space-between;align-items:flex-end;margin:28px 0 10px;gap:10px}
.secrow .sec{margin:0}
.secrow p{font-size:13px;color:var(--ink3)}
.gauge{height:8px;border-radius:999px;background:color-mix(in srgb,var(--c3) 80%,transparent);overflow:hidden;position:relative}
.gauge i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p),var(--s));box-shadow:0 0 12px color-mix(in srgb,var(--s) 55%,transparent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.gauge.green i{background:linear-gradient(90deg,var(--t),var(--tm));box-shadow:0 0 10px color-mix(in srgb,var(--tm) 60%,transparent)}
.gauge.thin{height:6px}
.notice{border-radius:22px;padding:14px 16px;margin:14px 0;font-size:14px;background:color-mix(in srgb,var(--gl) 85%,transparent);border:1px solid var(--edge)}

/* ---- home ---- */
.greet{padding-top:6px}
.greet .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.greet h1{font-family:var(--fh);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.greet p{color:var(--ink2);margin-top:2px}
.greet .gauge{margin-top:14px}
.greet .lv{display:flex;justify-content:space-between;margin-top:7px;font-size:13px;color:var(--ink3);font-weight:600}
.greet .lv b{color:var(--ink);font-family:var(--fh);font-weight:700}
.hero{position:relative;overflow:hidden;padding:16px}
.hero .flare1,.hero .flare2{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(40px);pointer-events:none;opacity:.6}
.hero .flare1{top:-70px;right:-50px;background:var(--pl)} .hero .flare2{bottom:-70px;left:-50px;background:var(--sl)}
.heroimg{position:relative;border-radius:22px;overflow:hidden;height:220px;background:var(--c1)}
.heroimg img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.heroimg .tl,.heroimg .tr{position:absolute;top:12px;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12.5px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.heroimg .tl{left:12px;background:rgba(255,255,255,.85);color:#181A2F}
.heroimg .tl .ic{color:var(--p);width:15px;height:15px}
.heroimg .tr{right:12px;background:color-mix(in srgb,var(--t) 92%,transparent);color:#fff}
.heroimg .tr .ic{width:14px;height:14px}
.hero h2{font-family:var(--fh);font-weight:700;font-size:23px;letter-spacing:-.01em;line-height:1.2;margin-top:14px}
.hero p.d{color:var(--ink2);margin-top:4px;font-size:14.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chiprow .chip .ic{color:var(--p)}
.done-hero{text-align:center}
.done-hero h2{margin-top:6px}
.jr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:4px 18px 18px;scrollbar-width:none}
.jr::-webkit-scrollbar{display:none}
.jc2{flex:none;width:236px;scroll-snap-align:center;border-radius:26px;padding:10px;display:flex;flex-direction:column;text-align:left;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:var(--shs)}
.jc2 .art{position:relative;height:132px;border-radius:18px;overflow:hidden}
.jc2 .art svg{width:100%;height:100%}
.jc2 .st{position:absolute;top:8px;left:8px;display:flex;gap:4px;align-items:center;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:#181A2F;font-weight:700;font-size:11.5px}
.jc2 .st .ic{width:13px;height:13px;color:var(--t);stroke-width:3}
.jc2 .sm{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:999px;background:rgba(24,26,47,.7);color:#fff;font-weight:700;font-size:11px;display:flex;gap:4px;align-items:center}
.jc2 .sm .ic{width:12px;height:12px}
.jc2 .me{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:#cfd8f0 center 18%/cover;box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.2)}
.jc2 .lockv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,255,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.jc2 .lockv span{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#484555}
.jc2 .bd{padding:10px 4px 2px}
.jc2 .bd small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink3);text-transform:uppercase}
.jc2 .bd b{display:block;font-family:var(--fh);font-weight:700;font-size:17px;line-height:1.2;margin-top:2px}
.jc2 .bd p{font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jc2.cur{box-shadow:0 0 0 2px var(--p),var(--sh)}
.jc2.lock{opacity:.8}
.bites{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bite{border-radius:22px;padding:12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:var(--shs);transition:transform .12s}
.bite:active{transform:scale(.96)}
.bite i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.bite b{font-family:var(--fh);font-weight:700;font-size:14.5px;line-height:1.2;display:block}
.bite small{font-size:11.5px;color:var(--ink3);display:block}
.bite[disabled]{opacity:.55}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(24,26,47,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);width:100%;max-width:460px;border-radius:32px 32px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .25s cubic-bezier(.2,.9,.3,1.1)}
.sheet h3{font-family:var(--fh);font-weight:700;font-size:24px;margin:6px 0 8px}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(40px);opacity:.4}}

/* ---- grove ---- */
.grovehead{display:flex;gap:14px;align-items:center}
.grovehead h1{font-family:var(--fh);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.grovehead p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.ring{width:66px;height:66px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--fh);font-weight:800;font-size:20px;line-height:1}
.ring small{display:block;font-size:10px;color:var(--ink3);text-align:center;font-weight:700}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:2px 18px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--shs);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.filters button[aria-pressed="true"]{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-color:transparent}
.grove{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tree{border-radius:26px;padding:8px 8px 12px;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:var(--shs);text-align:left}
.tree .pic{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;background:var(--c1)}
.tree .pic img{width:100%;height:100%;object-fit:cover}
.tree .pic img.seed{filter:grayscale(.9) opacity(.5) blur(.5px)}
.tree .lv{position:absolute;left:8px;top:8px;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(255,255,255,.9);color:#181A2F;font-weight:700;font-size:11.5px;display:flex;align-items:center;gap:5px}
.tree .lv i{width:7px;height:7px;border-radius:50%;background:var(--tc,var(--p))}
.tree .seedtag{position:absolute;inset:auto 8px 8px 8px;text-align:center;padding:5px;border-radius:12px;background:rgba(255,255,255,.88);color:#484555;font-size:11.5px;font-weight:700}
.tree .body{padding:10px 6px 0;flex:1;display:flex;flex-direction:column;gap:3px}
.tree .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tree b{font-family:var(--fh);font-weight:700;font-size:16.5px;line-height:1.2}
.tree .pc{font-family:var(--fh);font-weight:700;font-size:13px;color:var(--tc,var(--p))}
.tree small{font-size:12px;color:var(--ink3);line-height:1.3}
.tree small em{font-style:normal;font-weight:700;color:var(--tc,var(--p))}
.tree .gauge{height:5px;margin-top:6px}
.tree .gauge i{background:var(--tc,var(--p));box-shadow:0 0 8px var(--tc,var(--p))}
.tree .btn{min-height:38px;font-size:13.5px;margin-top:10px;padding:6px 10px;gap:6px;white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--p)) 14%,var(--glass));color:var(--ink);box-shadow:none;border:1px solid var(--edge)}
.tree .btn .ic{color:var(--tc,var(--p));width:16px;height:16px}
.tree .btn[disabled]{opacity:.6}
.art{width:100%;height:100%;display:grid;place-items:center}

/* ---- profile ---- */
.pp{text-align:center;padding-top:22px;margin-top:22px;overflow:visible}
.ribbon{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:12.5px;padding:6px 14px;border-radius:999px;box-shadow:0 8px 18px -6px color-mix(in srgb,var(--p) 70%,transparent);white-space:nowrap;display:flex;align-items:center;gap:2px}
.ribbon .ic{color:#fff}
.bigava{width:116px;height:116px;border-radius:50%;margin:8px auto 0;background:#cfd8f0 center 18%/cover;box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--tm),0 0 30px color-mix(in srgb,var(--tm) 50%,transparent);position:relative}
.bigava span{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--t);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.bigava span .ic{width:16px;height:16px;stroke-width:3}
.pp h1{font-family:var(--fh);font-weight:700;font-size:26px;margin-top:14px;letter-spacing:-.01em}
.pp .since{color:var(--ink2);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;gap:8px}
.stat3 div{padding:12px 4px;border-radius:18px;background:var(--glass2)}
.stat3 b{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--fh);font-weight:800;font-size:22px}
.stat3 b .ic{color:var(--p);width:17px;height:17px}
.stat3 span{font-size:12px;color:var(--ink2)}
.pin{width:44px;height:44px;border-radius:14px;background:var(--pl);display:grid;place-items:center;color:var(--p);flex:none}
.radarhead{display:flex;gap:12px;align-items:center}
.radarhead b{display:block;font-family:var(--fh);font-weight:700;font-size:19px;line-height:1.2}
.radarhead small{color:var(--ink2);font-size:13px;display:flex;align-items:center;gap:6px}
.radar svg{width:100%;height:auto;margin:6px auto 0}
.radar .ringl{fill:none;stroke:var(--line);stroke-width:1.5}
.radar .axis{stroke:var(--line);stroke-width:1.5}
.radar .base{fill:none;stroke:var(--ink3);stroke-width:2;stroke-dasharray:5 5}
.radar .now{fill:url(#rg);stroke:var(--p);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--p) 40%,transparent))}
.radar .ax{fill:var(--ink2);font-family:var(--fb);font-size:13px;font-weight:700}
.radar .vtx{fill:var(--s);stroke:#fff;stroke-width:2.5}
.toggle2{display:flex;gap:8px;justify-content:center;margin-top:8px}
.toggle2 button{padding:6px 14px;border-radius:999px;background:var(--glass2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.toggle2 button i{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.toggle2 button[aria-pressed="true"]{background:var(--pl);color:var(--pd)}
.toggle2 button[aria-pressed="true"] i{background:var(--p)}
.journal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.jc{border-radius:24px;padding:14px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:var(--shs)}
.jc .t{display:flex;justify-content:space-between;align-items:flex-start}
.jc .t i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--jb,var(--c2));color:var(--jf,var(--ink))}
.jc .t small{font-weight:700;font-size:12px;color:var(--jf,var(--ink2))}
.jc b{display:block;font-family:var(--fh);font-weight:800;font-size:30px;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.jc b em{font-style:normal;font-size:16px;font-weight:600}
.jc span{font-weight:600;font-size:12.5px;color:var(--ink2)}
.kn{display:flex;align-items:center;gap:12px;padding:12px 0}
.kn+.kn{border-top:1px solid var(--line)}
.kn img{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none}
.kn b{font-family:var(--fh);font-weight:700;font-size:16px;display:block}
.kn small{color:var(--ink3);font-size:12.5px}
.kn .gauge{flex:1;min-width:70px}
details.set{margin-top:12px;border-radius:22px;padding:2px 16px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs)}
details.set summary{list-style:none;padding:14px 0;font-family:var(--fh);font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.set summary .ic{color:var(--p)}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--ink3)}
details.set[open] summary::after{content:"–"}
details.set .inner{padding:0 0 16px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;width:100%;font-weight:600;border-top:1px solid var(--line)}
.tog .sl{width:50px;height:30px;border-radius:15px;background:var(--c3);position:relative;flex:none}
.tog .sl::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .15s}
.tog[aria-pressed="true"] .sl{background:var(--t)}
.tog[aria-pressed="true"] .sl::after{left:24px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:16px;padding:12px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--glass2);color:var(--ink);margin-top:10px;resize:vertical}

/* ---- shop ---- */
.shophead{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.shophead h1{font-family:var(--fh);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.equipped{display:flex;align-items:center;gap:12px}
.badge3d{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--p) 80%,transparent)}
.badge3d .ic{width:26px;height:26px}
.equipped b{font-family:var(--fh);font-weight:700;font-size:18px;display:block}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.th{border-radius:24px;padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);transition:transform .12s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.th:active{transform:scale(.97)}
.th[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--p),var(--sh)}
.th .pic{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10}
.th .pic svg{width:100%;height:100%}
.th .tag{position:absolute;left:7px;top:7px;padding:3px 9px;border-radius:999px;font-weight:700;font-size:11px;background:rgba(255,255,255,.9);color:var(--td)}
.th .tag.eq{background:var(--p);color:#fff} .th .tag.lg{background:var(--g);color:#4A3600}
.th .lk{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,255,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.th .lk span{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#181A2F}
.th .lk span .ic{width:18px;height:18px}
.th b{font-family:var(--fh);font-weight:700;font-size:15.5px;margin:10px 4px 0;line-height:1.2}
.th small{margin:0 4px;font-size:12px;color:var(--ink3);display:flex;gap:4px;align-items:center}
.th small.ok{color:var(--td);font-weight:700}
.th small .ic{width:13px;height:13px}
.sw3{display:flex;gap:6px;margin:10px 4px 0}
.sw3 i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.12)}
.supply{display:flex;align-items:center;gap:12px;padding:12px 0}
.supply+.supply{border-top:1px solid var(--line)}
.supply i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none}
.supply b{font-family:var(--fh);font-weight:700;display:block}
.supply small{color:var(--ink3);font-size:12.5px;display:block;line-height:1.3}
.supply .btn{width:auto;margin:0 0 0 auto;min-height:40px;font-size:14px;padding:6px 14px;flex:none;background:var(--gl);color:var(--gd);box-shadow:none}
.supply .btn .ic{width:15px;height:15px}

/* ---- session chrome ---- */
.play{min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
@supports (height:100dvh){.play{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.xbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.xbtn .ic{width:21px;height:21px;stroke-width:2.4}
.xbtn:active{transform:scale(.94)}
.shead .ttl{font-family:var(--fh);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.shead .ttl i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--p2),var(--p));display:grid;place-items:center;color:#fff;flex:none}
.shead .ttl i .ic{width:17px;height:17px}
.shead .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .ava{width:36px;height:36px}
.steps{display:flex;align-items:center;gap:10px;border-radius:999px;padding:7px 8px 7px 16px;margin-top:6px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.steps .lbl{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink2)}
.steps .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--t);box-shadow:0 0 8px var(--tm)}
.steps .track{display:flex;align-items:center;margin-left:auto;gap:3px}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c2);color:var(--ink3)}
.steps .n .ic{width:14px;height:14px;stroke-width:2.6}
.steps .n.d{background:var(--t);color:#fff}
.steps .n.c{background:linear-gradient(135deg,var(--s2),var(--s));color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--s) 18%,transparent);width:32px;height:32px}
.steps .bar{width:7px;height:3px;border-radius:3px;background:var(--c3)}
.steps .bar.d{background:var(--tm)}

/* intro */
.intro{margin-top:14px;border-radius:30px;padding:14px 14px 20px;overflow:hidden;position:relative}
.intro .heroimg{height:230px}
.intro .tagline{display:inline-flex;align-items:center;gap:6px;margin:16px 4px 0;font-weight:700;font-size:12.5px;color:var(--p)}
.intro .tagline .ic{width:15px;height:15px}
.intro .tr{display:flex;gap:12px;align-items:flex-start;margin:4px 4px 0}
.intro h1{font-family:var(--fh);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.025em;flex:1}
.intro h1 span{display:block;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1.long{font-size:29px}
.intro .chiprow,.intro .how,.intro .duo,.intro .foot{margin-left:4px;margin-right:4px}
.intro .how{font-size:15px;color:var(--ink2);margin-top:12px;line-height:1.55}
.intro .badge3d{display:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.duo div{border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--edge)}
.duo i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pl);color:var(--p)}
.duo i.g{background:var(--tl);color:var(--td)}
.duo small{display:block;font-weight:600;font-size:12px;color:var(--ink3);line-height:1.2}
.duo b{display:block;font-family:var(--fh);font-weight:700;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.duo b.g{color:var(--td)}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;color:var(--ink3);font-size:13px}
.dyk{display:flex;gap:12px;align-items:center;border-radius:24px;padding:14px 16px;margin-top:16px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dyk i{width:44px;height:44px;border-radius:14px;background:var(--pl);display:grid;place-items:center;color:var(--p);flex:none}
.dyk p{font-size:14px;line-height:1.5;color:var(--ink2)}
.dyk p b{color:var(--ink);font-family:var(--fh);font-weight:700}
.dyk.cortex i{background:none;overflow:hidden}
.dyk.cortex img{width:44px;height:44px;object-fit:cover;border-radius:14px}

/* in-game */
.hud{display:flex;gap:8px;margin-top:6px;align-items:center}
.timer{flex:1;display:flex;align-items:center;gap:10px;border-radius:999px;padding:10px 14px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.timer .ic{color:var(--s);width:20px;height:20px}
.timer .gauge{flex:1;height:8px}
.timer .gauge i{width:100%;transition:none}
.timer b{font-family:var(--fh);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;min-width:36px;text-align:right}
.combo{padding:10px 14px;border-radius:999px;background:linear-gradient(90deg,var(--s),var(--s2));color:#fff;box-shadow:0 10px 22px -8px var(--s);font-family:var(--fh);font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;transition:transform .15s,opacity .15s;white-space:nowrap;overflow:hidden}
.combo .ic{width:15px;height:15px}
.combo.off{opacity:0;transform:scale(.7);max-width:0;padding-left:0;padding-right:0;margin-left:-8px}
.combo.pop{animation:cpop .3s}
@keyframes cpop{50%{transform:scale(1.15)}}
.scorecard{display:flex;align-items:center;gap:12px;border-radius:24px;padding:12px 14px;margin-top:10px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.coin{width:44px;height:44px;border-radius:14px;background:var(--gl);display:grid;place-items:center;color:var(--gd);flex:none}
.coin .ic{width:22px;height:22px}
.coin.img{background:none;overflow:hidden}
.coin.img img{width:44px;height:44px;object-fit:cover;border-radius:14px}
.scorecard small{display:block;font-weight:600;font-size:12px;color:var(--ink3)}
.scorecard b{display:block;font-family:var(--fh);font-weight:800;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.scorecard .chip{margin-left:auto}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:14px 0 10px;position:relative;user-select:none;-webkit-user-select:none;border-radius:28px;transition:background .2s}
.stage.ok{background:radial-gradient(60% 50% at 50% 45%,color-mix(in srgb,var(--good) 16%,transparent),transparent)}
.stage.bad{background:radial-gradient(60% 50% at 50% 45%,color-mix(in srgb,var(--bad) 16%,transparent),transparent)}
.stage>.hint{width:100%;border-radius:22px;padding:14px 18px;font-family:var(--fh);font-weight:600;font-size:17px;line-height:1.3;text-align:left;min-height:54px;display:flex;align-items:center;background:var(--glass2);border:1px solid var(--edge)}
.hint{color:var(--ink);font-size:15px}
.float{position:absolute;top:70px;right:8px;font-family:var(--fh);font-weight:800;color:var(--t);font-size:22px;animation:up .7s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-26px);opacity:0}}
.prompt{font-family:var(--fh);font-size:clamp(34px,10vw,50px);font-weight:800;text-align:center;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:6px}
.prompt.mid{font-size:clamp(24px,7vw,32px);font-weight:700}
.prompt.mid.small{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opts.one{grid-template-columns:1fr}
.opt{min-height:66px;padding:10px;border-radius:22px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shs);font-family:var(--fh);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.15;text-align:center;transition:transform .08s,background .15s;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.opts.one .opt{font-size:18px;min-height:58px}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--good);color:#fff;border-color:transparent;box-shadow:0 10px 24px -8px var(--good)}
.opt.wrong{background:var(--bad);color:#fff;border-color:transparent;box-shadow:0 10px 24px -8px var(--bad)}
.opt .two{display:flex;flex-direction:column;align-items:center;font-size:18px}
.opt .two .dim{opacity:.35}
.tlimit{width:100%;height:5px;border-radius:4px;background:var(--c3);overflow:hidden}
.tlimit i{display:block;height:100%;width:100%;background:var(--ink3);border-radius:4px}
.sw{width:52px;height:34px;border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.stroop{font-family:var(--fh);font-size:clamp(52px,16vw,74px);font-weight:800;letter-spacing:-.02em;padding:10px 0}
.arrows{display:flex;gap:6px;color:var(--ink)}
.arrows svg{width:40px;height:40px}
.opt .arrows{color:inherit}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;width:min(88vw,360px);padding:14px;border-radius:28px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh)}
.cell{aspect-ratio:1;border-radius:16px;background:var(--c2);transition:background .15s,transform .08s,box-shadow .15s}
.cell:active{transform:scale(.95)}
.cell.lit{background:linear-gradient(135deg,var(--p2),var(--p));box-shadow:0 0 18px color-mix(in srgb,var(--p) 55%,transparent)}
.cell.hit{background:var(--tm);box-shadow:0 0 14px color-mix(in srgb,var(--tm) 60%,transparent)}
.cell.miss{background:var(--bad)}
.cell.show{background:color-mix(in srgb,var(--p) 30%,var(--c2))}
.arena{position:relative;width:min(84vw,330px);aspect-ratio:1;border-radius:50%;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh)}
.arena .fix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--fh);font-size:30px;font-weight:800;color:var(--ink3)}
.slot{position:absolute;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed var(--c3);display:grid;place-items:center;background:transparent}
.slot.live{border:0;background:var(--c2)}
.slot.mask{background:repeating-conic-gradient(var(--ink) 0 25%,var(--bg) 0 50%) 0 0/10px 10px;border:0}
.slot.right{background:var(--good)}
.slot.wrong{background:var(--bad)}
.shape{width:48%;aspect-ratio:1;display:block}
.shape.dia{background:var(--s);transform:rotate(45deg);border-radius:4px}
.shape.dia.hol{background:transparent;border:3px solid var(--ink3)}
.shape.dia.alt{background:var(--ink3)}
.shape.cir{border-radius:50%;background:var(--p)}
.shape.sq{background:var(--p);border-radius:4px}
.shape.cir.alt{background:var(--t)}
.shape.cir.big{transform:scale(1.28)}
.field{position:absolute;inset:0}
.field .d{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:var(--p);transform:translate(-50%,-50%)}
.field.mask{background:repeating-conic-gradient(var(--c3) 0 25%,transparent 0 50%) 0 0/14px 14px;border-radius:50%}
.optwrap{width:100%}
.fcard{width:190px;height:190px;border-radius:34px;border:12px solid var(--rule);display:grid;place-items:center;background:var(--glass);font-family:var(--fh);font-size:92px;font-weight:800;line-height:1;box-shadow:var(--sh)}
.fshape{width:96px;height:96px}
.fshape.circle{border-radius:50%}
.fshape.square{border-radius:10px}
.pat{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:100%;aspect-ratio:1}
.pat i{background:var(--c3);border-radius:3px}
.pat i.on{background:var(--ink)}
.opt .pat{width:74%}
.opt.pbtn{aspect-ratio:1;min-height:0}
.opt.right .pat i.on,.opt.wrong .pat i.on{background:#fff}
.target{width:124px;padding:10px;border-radius:18px;background:var(--glass);box-shadow:var(--shs)}
.opts.pats{max-width:340px}
.count{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--fh);font-size:140px;font-weight:800;z-index:30;pointer-events:none;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.count span{animation:pop .5s ease-out;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* knowledge card */
.kprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.kprog .gauge{flex:1}
.kprog .gauge i{background:linear-gradient(90deg,var(--t),var(--tm))}
.kcardw{width:100%}
.kcard{position:relative;border-radius:30px;padding:20px 18px 22px;text-align:center;overflow:hidden;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.kcard::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;top:-110px;right:-60px;background:var(--pl);filter:blur(30px);opacity:.8}
.kcard>*{position:relative}
.kcard .kt{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.kcard .prompt{margin-top:4px}
.kcard .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.kq{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:4px}
.kq b{font-family:var(--fh);font-weight:700;font-size:15px}
.opts.letters .opt{justify-content:flex-start;text-align:left;padding:10px 14px;font-size:17px;min-height:60px;gap:12px;font-weight:600}
.opts.letters .opt .L{width:34px;height:34px;border-radius:11px;background:var(--pl);color:var(--pd);display:grid;place-items:center;font-size:15px;flex:none;font-weight:700}
.opts.letters .opt.right .L,.opts.letters .opt.wrong .L{background:rgba(255,255,255,.25);color:#fff}
.fb{position:sticky;bottom:0;margin-top:14px;padding-top:6px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.fbbar{display:flex;align-items:center;gap:10px;border-radius:18px;padding:12px 16px;font-family:var(--fh);font-weight:600;font-size:16px}
.fbbar.ok{background:var(--tl);color:var(--td)}
.fbbar.no{background:color-mix(in srgb,var(--bad) 14%,var(--glass));color:var(--ink)}
.fbbar.no b{color:var(--bad)}
.fbbar .ic{width:22px;height:22px}

/* results */
.rhero{position:relative;border-radius:28px;overflow:hidden;margin-top:8px;aspect-ratio:16/10;background:var(--c2);box-shadow:var(--sh)}
.rhero img,.rhero svg{width:100%;height:100%;object-fit:cover}
.rhero .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,transparent,rgba(24,26,47,.35))}
.rhero .cap .chip{background:rgba(255,255,255,.9);color:var(--td);font-weight:700}
.rhero .cap h2{font-family:var(--fh);font-weight:700;font-size:21px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35);line-height:1.15;text-align:center}
.scorebig{text-align:center}
.scorebig b{font-family:var(--fh);font-weight:800;font-size:60px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;display:block;margin-top:6px;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.scorebig b small{font-size:20px;font-weight:700}
.near{display:flex;align-items:center;gap:8px;justify-content:center;border-radius:16px;padding:10px 14px;margin-top:14px;font-weight:600;font-size:14px;background:var(--sl);color:var(--sd)}
.acc{display:flex;align-items:center;gap:12px}
.acc .coin{background:var(--tl);color:var(--td)}
.acc b{font-family:var(--fh);font-weight:700;font-size:20px;display:block}
.stars{margin-left:auto;display:flex;gap:2px}
.stars .ic{width:26px;height:26px;color:var(--g)}
.stars .ic.on{fill:var(--g)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two2 .card{margin:0;padding:14px}
.two2 .eyebrow{display:flex;align-items:center;gap:6px;color:var(--ink3)}
.two2 .eyebrow .ic{width:16px;height:16px;color:var(--p)}
.two2 b{display:block;font-family:var(--fh);font-weight:700;font-size:21px;color:var(--td);margin-top:6px}
.two2 b.o{color:var(--sd)}
.two2 small{color:var(--ink2);font-size:13px}
.pills2{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.cleared{text-align:center;padding-top:4px}
.cleared .fig{position:relative;height:260px;border-radius:30px;overflow:hidden;margin-top:6px;box-shadow:var(--sh)}
.cleared .fig img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.cleared .fig .chip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--td);font-weight:700}
.cleared h1{font-family:var(--fh);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin-top:16px}
.cleared h1 span{background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.cleared p{color:var(--ink2);font-size:15px;margin-top:6px}
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.bigstats .card{margin:0;padding:14px;text-align:left;border-radius:24px}
.bigstats .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;color:var(--ink2)}
.bigstats .t i{width:34px;height:34px;border-radius:11px;background:var(--sl);color:var(--s);display:grid;place-items:center}
.bigstats b{display:block;font-family:var(--fh);font-weight:800;font-size:38px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigstats b small{font-size:16px;font-weight:600;color:var(--ink3)}
.bigstats .sub{font-weight:600;font-size:12px;color:var(--td)}
.newstop{display:flex;align-items:center;gap:14px;text-align:left}
.stamp{width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;background:var(--glass2);border:2px dashed color-mix(in srgb,var(--p) 50%,transparent);transform:rotate(-8deg)}
.newstop b{display:block;font-family:var(--fh);font-weight:700;font-size:19px;line-height:1.2}
.chestbox{text-align:center;border-radius:28px;padding:20px 16px;margin-top:16px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);position:relative;overflow:hidden}
.chestbox::before{content:"";position:absolute;inset:auto -40px -80px -40px;height:180px;background:radial-gradient(closest-side,var(--sl),transparent);pointer-events:none}
.chestbox>*{position:relative}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.loot .chip .ic{color:var(--s)}
.chest{display:block;margin:4px auto 0;width:120px;height:120px;position:relative}
.chest .base{position:absolute;left:14px;right:14px;bottom:8px;height:62px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.95),color-mix(in srgb,var(--sl) 80%,#fff));box-shadow:0 18px 30px -10px color-mix(in srgb,var(--s) 70%,transparent),inset 0 0 0 1px rgba(255,255,255,.9)}
.chest .base::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:linear-gradient(180deg,var(--s2),var(--s))}
.chest .lid{position:absolute;left:8px;right:8px;top:26px;height:28px;border-radius:10px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--sl) 70%,#fff));box-shadow:0 6px 14px -6px color-mix(in srgb,var(--s) 60%,transparent),inset 0 0 0 1px rgba(255,255,255,.9);transform-origin:12% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:linear-gradient(180deg,var(--s2),var(--s))}
.chest .lock{position:absolute;left:50%;top:10px;width:30px;height:20px;margin-left:-15px;z-index:2;border-radius:50% 50% 0 0;border:5px solid var(--s);border-bottom:0}
.chest.wiggle{animation:wig 1.8s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.chest.open .lid{transform:rotate(-35deg) translate(-4px,-14px)}
.chest.open .lock{opacity:0}

/* ---------- knowledge (spaced repetition) ---------- */
/* Scheduler: SM-2 style. Each card keeps an interval (iv, days) and an ease (e).
   Quality q: 1 forgot, 2 hard, 3 good, 4 easy (true/false still accepted).
   A brand-new card answered right comes back tomorrow, not in a week: one lucky multiple-choice
   guess is not a memory. Intervals then expand by the ease factor; a lapse resets to 1 day and makes the card a little harder. */

  if (q === true) q = 3; else if (q === false || !q) q = 1;
  const t = today(); let r = state.srs[kind][id];
  if (!r) {
    const iv = q >= 4 ? 3 : 1;
    r = state.srs[kind][id] = { b: boxOf(iv), iv, e: q >= 4 ? 2.6 : q === 2 ? 2.3 : 2.5, due: addDays(t, iv), n: 1, ok: q >= 2 ? 1 : 0, lp: 0, last: t };

/* ---------- plans ---------- */
function checkupDue() {

    const steps = games.map(([e, m]) => ({ t: "game", eng: e, variant: ENGINES[e].assess, mode: m || "assess" }));

function parseEs(text) {
  let cat = "General"; const out = [];
  text.split(/\r?\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    if (l.startsWith("#")) { cat = l.replace(/^#+/, "").trim() || "General"; return; }
    const m = l.split(/\t| [-–—=:] |[-–—=:]|,/);
    if (m.length < 2) return;
    const es = m[0].trim(), en = m.slice(1).join(", ").trim();
    if (es && en) out.push({ es, en, cat });
  });
  return normEs(out);
}
function parseTr(text) {
  let country = ""; const out = [];
  text.split(/\r?\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    if (l.startsWith("#")) { country = l.replace(/^#+/, "").trim(); return; }
    const p = l.split("|").map(s => s.trim());
    if (p.length < 3) return;
    out.push({ place: p[0], country, q: p[1], a: p[2], wrong: p[3] ? p[3].split(";").map(s => s.trim()).filter(Boolean) : [] });
  });
  return normTr(out);
}
async function importContent(kind, mode) {
  const ta = $(kind === "es" ? "#esIn" : "#trIn"); const items = kind === "es" ? parseEs(ta.value) : parseTr(ta.value);
  if (!items.length) { toast(kind === "es" ? "No words found. Use one per line: spanish - english" : "No facts found. Use: Place | Question | Answer"); return; }
  const sampleKey = kind === "es" ? "esSample" : "trSample";
  let list = mode === "replace" || content[sampleKey] ? items : content[kind].concat(items);
  const seen = new Set(); list = list.filter(x => !seen.has(x.id) && seen.add(x.id));
  content[kind] = list; content[sampleKey] = false;
  try { localStorage.setItem(LSC, JSON.stringify({ es: content.esSample ? null : content.es, tr: content.trSample ? null : content.tr })); } catch (e) {}
  if (db) { try { await db.doc(kind === "es" ? "content/spanish" : "content/travel").set({ items: list, updatedAt: Date.now() }); } catch (e) {} }
  toast(`${items.length} ${kind === "es" ? "words" : "facts"} loaded`);
  render();
}

  [3, 2, 1].forEach((n, i) => cdT.push(setTimeout(() => { cd.innerHTML = `<span>${n}</span>`; }, i * 520)));
  cdT.push(setTimeout(() => { cd.remove(); r.tEnd = performance.now() + dur; tick(); next(); }, 1560));
  function tick() { if (r.ended) return; const left = r.tEnd - performance.now(); clk.style.width = `${clamp(left / dur, 0, 1) * 100}%`; const sl = Math.max(0, Math.ceil(left / 1000)); secsEl.textContent = `${Math.floor(sl / 60)}:${String(sl % 60).padStart(2, "0")}`; if (left <= 0) { finish(); return; } raf = requestAnimationFrame(tick); }
  function next() {
    if (r.ended) return; if (performance.now() >= r.tEnd) { finish(); return; }
    const it = deck[di++ % deck.length];
    const wrong = (it.w || []).filter(w => w && w !== it.a)[0] || (deck.find(x => x.a !== it.a) || {}).a || "None of these";
    const { options, correct } = withOptions(it.a, [wrong]);
    stage.classList.remove("ok", "bad");
    const top = `<div class="kcardw"><div class="kcard">${it.place ? `<div class="eyebrow m" style="margin-bottom:4px">${esc(it.place)}${it.seen ? "" : " · new"}</div>` : ""}<div class="prompt mid ${it.q.length > 60 ? "small" : ""}">${esc(it.q)}</div></div></div>`;
    r.cleanup = choice(stage, { top, options, correct, cls: "one" }, ok => {
      if (r.ended) return; r.n++; tone(ok); buzz(ok); stage.classList.add(ok ? "ok" : "bad");
      if (!it.seen) { grade(it.kind, it.id, ok ? 3 : 1); it.seen = true; }
      if (ok) { r.right++; r.combo++; r.maxCombo = Math.max(r.maxCombo, r.combo); const m = r.combo >= 10 ? 2 : r.combo >= 5 ? 1.5 : 1; r.score += Math.round(10 * m); scoreEl.textContent = fmt(r.score);
        if (r.combo >= 3) { comboEl.classList.remove("off"); comboEl.innerHTML = `x${m} ${ic("flame")}`; } }
      else { r.combo = 0; comboEl.classList.add("off"); }
      nextT = setTimeout(next, ok ? 300 : 1300);
    });
  }
  function finish() {
    if (r.ended) return; r.ended = true; cancelAnimationFrame(raf); clearTimeout(nextT); if (r.cleanup) r.cleanup(); currentAbort = null;
    const prev = state.rushBest || 0; state.rushBest = Math.max(prev, r.score);
    const coins = Math.min(25, 5 + r.right), xp = P.kind === "practice" ? 0 : 20 + r.right;
    addCoins(coins); P.results.push({ t: "puzzle", kind: "rush", xp, coins }); P.idx++;
    const s = state.pzs.rush || (state.pzs.rush = { played: 0, won: 0, streak: 0, dist: [] }); s.played++;
    if (typeof checkAwards === "function") checkAwards();
    save();
    const acc = r.n ? r.right / r.n : 0, stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : acc >= 0.4 ? 1 : 0;
    app.innerHTML = `<div class="play">${shead()}<section class="card scorebig" style="margin-top:14px"><div class="eyebrow m">Rapid recall</div><b>${fmt(r.score)} <small>pts</small></b>${r.score > prev && prev ? `<div class="near">${ic("trophy")}New best!</div>` : prev ? `<div class="near">${ic("flame")}Your best is ${fmt(state.rushBest)}</div>` : ""}</section>
    <section class="card acc"><span class="coin">${ic("check")}</span><div><div class="eyebrow m">Correct</div><b>${r.right} of ${r.n}</b></div><span class="stars">${[0, 1, 2].map(k => ic("star", k < stars ? "on" : "")).join("")}</span></section>
    <div class="pills2">${xp ? `<span class="chip o">${ic("zap")}+${xp} XP</span>` : ""}<span class="chip y">${ic("sun")}+${coins} coins</span><span class="chip v">${ic("flame")}Best combo x${r.maxCombo}</span></div>${P.kind === "practice" && P.steps.length === 1 ? `<button class="btn ghost" data-s="again">${ic("sparkle")}Play again</button>` : ""}${nextBtn()}</div>`;
    if (r.score > prev && prev) setTimeout(() => burst(innerWidth / 2, 180, 24), 100);
  }
}

applySkin(); processMissed(); render(); initCloud();

</script>
